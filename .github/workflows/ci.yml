name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Ручной запуск: все проверки и сборка iOS (она не идёт в PR и на main).
  workflow_dispatch:
    inputs:
      ios:
        description: Собрать iOS (macOS)
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  engine:
    name: Движок (tacho_engine)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/tacho_engine
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Движок не зависит от Flutter
        run: |
          if grep -rnE "package:flutter|dart:ui" lib test tool; then
            echo "tacho_engine должен оставаться чистым Dart" >&2
            exit 1
          fi
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - name: Тесты с покрытием
        run: dart run coverage:test_with_coverage
      - name: Покрытие не ниже 95 %
        run: dart run tool/check_coverage.dart coverage/lcov.info 95 lib/
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-engine
          path: packages/tacho_engine/coverage/lcov.info
          if-no-files-found: ignore

  app:
    name: Приложение
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Сгенерированный код актуален
        run: |
          dart run build_runner build
          flutter gen-l10n
          git diff --exit-code -- lib
          untracked=$(git ls-files --others --exclude-standard -- lib)
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "Сгенерированные файлы не в git" >&2
            exit 1
          fi
      # Новая версия схемы без make-migrations — здесь появятся новые файлы.
      - name: Снимки схемы БД актуальны
        run: |
          dart run drift_dev make-migrations
          changed=$(git status --porcelain -- drift_schemas test/drift lib/data/db)
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "Запустите dart run drift_dev make-migrations" >&2
            exit 1
          fi
      - run: >-
          dart format --output=none --set-exit-if-changed
          lib test tool integration_test test_driver
      - run: flutter analyze --fatal-infos
      # Сценарии эмулятора без плагинов: на flutter_tester, база — во
      # временном файле. INT-03 и INT-04 здесь пропускаются.
      - name: Интеграционные сценарии без устройства
        run: flutter test -d flutter-tester integration_test/all_test.dart
      - run: flutter test --coverage
      - name: Покрытие lib/data не ниже 80 %
        run: >-
          dart run ../packages/tacho_engine/tool/check_coverage.dart
          coverage/lcov.info 80 lib/data/
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-app
          path: app/coverage/lcov.info
          if-no-files-found: ignore

  # Время в движке и базе — UTC. Прогон в других поясах ловит местное время
  # там, где его быть не должно.
  timezones:
    name: Часовой пояс ${{ matrix.tz }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [Europe/Warsaw, Asia/Kolkata, America/New_York]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Движок
        working-directory: packages/tacho_engine
        run: |
          dart pub get
          dart test
      - name: Приложение
        working-directory: app
        run: |
          flutter pub get
          flutter test

  prototype:
    name: Веб-прототип
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  secrets:
    name: Поиск секретов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Ключи и конфиги с секретами не в репозитории
        run: |
          pattern='(\.jks|\.keystore|\.p12|\.pem|(^|/)key\.properties|google-services\.json|GoogleService-Info\.plist)$'
          files=$(git ls-files | grep -Ei "$pattern" || true)
          if [ -n "$files" ]; then
            echo "$files"
            echo "Эти файлы не должны попадать в git" >&2
            exit 1
          fi
      # Новые коммиты: в PR — от базовой ветки, при push — от прошлого
      # состояния ветки.
      - name: gitleaks
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          range="$GITHUB_SHA"
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$BASE..$GITHUB_SHA"
          fi
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git /repo --log-opts="$range" --redact --no-banner --verbose

  build-android:
    name: Сборка Android
    needs: [engine, app]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # APK из артефакта ставят на свой телефон поверх прошлой (docs/beta/
      # README.md, «APK из CI на свой телефон»): нужен один ключ у всех
      # сборок — иначе у каждой свой случайный debug-ключ раннера, и Android
      # не обновляет установленную, только удалить и поставить заново.
      # Без секрета на main, тегах и ручном запуске сборка падает: такую APK
      # поверх не поставить. В PR — предупреждение: у PR из форков секретов
      # нет.
      - name: Постоянный ключ тестовой APK
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            message="Секрет ANDROID_DEBUG_KEYSTORE_BASE64 не задан: APK подписана случайным ключом и не обновит прошлую установку"
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              echo "::warning::$message"
              exit 0
            fi
            echo "::error::$message (docs/beta/README.md, «APK из CI на свой телефон»)"
            exit 1
          fi
          # Путь — Gradle явно (android/app/build.gradle.kts), а не
          # ~/.android: место ключа по умолчанию зависит от окружения
          keystore="$RUNNER_TEMP/debug.keystore"
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$keystore"
          # Ключ открывается паролями debug-ключа, с которыми подписывает
          # сборка; отпечаток — сверить, что все APK подписаны одним ключом
          if ! key=$(keytool -list -v -keystore "$keystore" \
            -storepass android -alias androiddebugkey); then
            echo "$key"
            echo "::error::Секрет ANDROID_DEBUG_KEYSTORE_BASE64 — не debug-ключ: нужен псевдоним androiddebugkey и пароль android (docs/beta/README.md)"
            exit 1
          fi
          echo "$key" | grep -E '^\s*SHA256:'
          echo "TACHOGO_DEBUG_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      # versionCode растёт с каждым запуском CI, как у выпусков в Google
      # Play: Android не ставит сборку с номером меньше установленной.
      - name: Debug APK (dev)
        run: >-
          flutter build apk --debug --dart-define-from-file=env/dev.json
          --build-number=$((1000 + GITHUB_RUN_NUMBER))
          --build-name="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)-dev.$GITHUB_RUN_NUMBER"

      # Подпись самой APK, а не только файла ключа: Gradle мог подписать
      # своим ключом, и тогда APK не встанет поверх прошлой.
      - name: APK подписана постоянным ключом
        if: ${{ env.TACHOGO_DEBUG_KEYSTORE != '' }}
        run: |
          sdk=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          apksigner=$(ls -d "$sdk"/build-tools/*/apksigner | sort -V | tail -n 1)
          signed=$("$apksigner" verify --print-certs \
            build/app/outputs/flutter-apk/app-debug.apk |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          expected=$(keytool -list -v -keystore "$TACHOGO_DEBUG_KEYSTORE" \
            -storepass android -alias androiddebugkey |
            sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
          echo "Подпись APK: $signed"
          if [ -z "$signed" ] || [ "$signed" != "$expected" ]; then
            echo "::error::APK подписана не постоянным ключом: $signed, нужен $expected"
            exit 1
          fi

      # Нативная часть на JVM (Robolectric): экран автозапуска, BG-09.
      # gradlew создаёт сборка выше.
      - name: Тесты Kotlin (Robolectric)
        working-directory: app/android
        run: ./gradlew :app:testDebugUnitTest

      # Плагины могут добавить разрешения, которых нет в нашем манифесте.
      - name: Итоговый манифест с плагинами
        run: dart run tool/check_android_manifest.dart

      - uses: actions/upload-artifact@v6
        with:
          name: android-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  # Что и куда выпускать (docs/beta/README.md, «Как выпустить бету»):
  # - main — staging во внутреннее тестирование Google Play (PLAY_MAIN_TRACK,
  #   `none` — только AAB в артефактах). Нет ключа загрузки — выпуск из main
  #   пропускается с предупреждением, CI остаётся зелёным;
  # - тег v1.2.3-beta.N — staging в закрытое тестирование (PLAY_BETA_TRACK);
  # - тег v1.2.3 — prod, пока только AAB в артефактах (Фаза 7).
  # Секреты в if недоступны — здесь только признаки, что они заданы.
  release-plan:
    name: План выпуска
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      env: ${{ steps.plan.outputs.env }}
      track: ${{ steps.plan.outputs.track }}
    steps:
      - id: plan
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          MAIN_TRACK: ${{ vars.PLAY_MAIN_TRACK || 'internal' }}
          BETA_TRACK: ${{ vars.PLAY_BETA_TRACK || 'alpha' }}
        run: |
          build=yes env=staging track=
          case "$GITHUB_REF" in
            refs/heads/main)
              track=$MAIN_TRACK
              if [ -z "$KEYSTORE" ]; then
                echo "::warning::Нет секрета ANDROID_KEYSTORE_BASE64 — выпуск из main пропущен"
                build=no
              fi ;;
            refs/tags/v*-beta*) track=$BETA_TRACK ;;
            refs/tags/v*) env=prod ;;
            *) build=no ;;
          esac
          [ "$track" = none ] && track=
          if [ "$build" = yes ] && [ -n "$track" ] && [ -z "$PLAY_KEY" ]; then
            echo "::warning::Нет секрета PLAY_SERVICE_ACCOUNT_JSON — AAB только в артефактах"
            track=
          fi
          echo "build=$build env=$env track=${track:-—}"
          {
            echo "build=$build"
            echo "env=$env"
            echo "track=$track"
          } >> "$GITHUB_OUTPUT"

  # Выпуск — только когда прошли все проверки приложения: движок, тесты в
  # поясах, поиск секретов, debug-сборка с Robolectric, эмулятор и
  # обновление поверх прошлой версии.
  # Веб-прототип выпуск не держит.
  release-android:
    name: Выпуск Android
    needs:
      - release-plan
      - engine
      - app
      - timezones
      - secrets
      - build-android
      - integration-android
      - upgrade-android
    if: ${{ needs.release-plan.outputs.build == 'yes' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
        with:
          # Теги — для версии сборки из main
          fetch-depth: 0
      # checkout может положить тег сборки лёгким — без сообщения для
      # «Что нового».
      - name: Теги с сообщениями
        run: git fetch --force --tags origin
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Ключ подписи из секретов
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Секрет ANDROID_KEYSTORE_BASE64 не задан — релиз не будет подписан" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload.jks
          cat > android/key.properties <<EOF
          storeFile=../upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # Номер сборки растёт с каждым запуском CI — Google Play не примет AAB
      # с уже загруженным versionCode. Версия — из тега, у main — от
      # последнего тега: 0.2.0-beta.1-3-gabc1234 — три коммита после него.
      - name: Версия
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            name="${GITHUB_REF_NAME#v}"
          elif desc=$(git describe --tags --match 'v[0-9]*' 2>/dev/null); then
            name="${desc#v}"
          else
            name="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)-dev.$GITHUB_RUN_NUMBER"
          fi
          echo "$name ($((1000 + GITHUB_RUN_NUMBER)))"
          {
            echo "BUILD_NAME=$name"
            echo "BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))"
          } >> "$GITHUB_ENV"

      # staging — в Sentry и PostHog отдельно от релиза, в «Ещё» —
      # «Сообщить о проблеме». Пустой секрет — сервис в сборке выключен.
      - name: Release AAB
        env:
          BUILD_ENV: ${{ needs.release-plan.outputs.env }}
          CRASH_DSN: ${{ secrets.SENTRY_DSN }}
          ANALYTICS_KEY: ${{ secrets.POSTHOG_KEY }}
        run: >-
          flutter build appbundle --release
          --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          --dart-define-from-file="env/$BUILD_ENV.json"
          --dart-define=CRASH_DSN="$CRASH_DSN"
          --dart-define=ANALYTICS_KEY="$ANALYTICS_KEY"

      - name: Итоговый манифест с плагинами
        run: dart run tool/check_android_manifest.dart

      # До загрузки в Play: первую сборку Play Console принимает только
      # вручную — её берут отсюда.
      - uses: actions/upload-artifact@v6
        with:
          name: android-release-${{ github.sha }}
          path: app/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

      # «Что нового» на русском (язык страницы в Play), до 500 знаков: у беты
      # — сообщение аннотированного тега, у main — заголовок PR из
      # merge-коммита или тема коммита.
      - name: Что нового
        if: ${{ needs.release-plan.outputs.track != '' }}
        run: |
          notes=
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$(git cat-file -t "$GITHUB_REF")" = tag ]; then
              notes=$(git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME")
            else
              echo "::warning::Тег без сообщения (git tag -a) — «Что нового» впишите в Play Console"
            fi
          elif git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            notes=$(git log -1 --format=%b)
          else
            notes=$(git log -1 --format=%s)
          fi
          dir="$RUNNER_TEMP/whatsnew"
          mkdir -p "$dir"
          printf '%s' "$notes" | python3 -c '
          import sys
          text = sys.stdin.read().strip()
          sys.stdout.write(text if len(text) <= 500 else text[:499] + "…")
          ' > "$dir/whatsnew-ru-RU"
          cat "$dir/whatsnew-ru-RU"
          if [ -s "$dir/whatsnew-ru-RU" ]; then
            echo "WHATS_NEW=$dir" >> "$GITHUB_ENV"
          fi

      # Пока приложение в Play — черновик (ни одного выпуска), API принимает
      # только PLAY_RELEASE_STATUS=draft.
      - name: Google Play (${{ needs.release-plan.outputs.track }})
        if: ${{ needs.release-plan.outputs.track != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: eu.tachogo.app
          releaseFiles: app/build/app/outputs/bundle/release/*.aab
          releaseName: ${{ env.BUILD_NAME }} (${{ env.BUILD_NUMBER }})
          track: ${{ needs.release-plan.outputs.track }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          whatsNewDirectory: ${{ env.WHATS_NEW }}

  # INT-01…05 и PERF-03 на эмуляторе Android: настоящие плагины, SQLite
  # устройства, foreground service. Маршрут GPS и смену пояса выполняет
  # помощник хоста (app/tool/integration/). docs/testing.md, раздел 14.
  integration-android:
    name: Эмулятор Android
    needs: [engine, app]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: KVM для эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Интеграционные тесты
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # Pixel 6 — 412 dp, основной таргет (по умолчанию экран 320 dp)
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none
          working-directory: app
          script: tool/integration/run_on_emulator.sh

  # UPG-01: обновление поверх прошлой версии, как из Google Play, — журнал
  # на месте (tool/integration/upgrade_on_emulator.sh, docs/testing.md,
  # раздел 14). Прошлая версия: у PR — его база, у main — main до push, у
  # тега — прошлый тег.
  upgrade-android:
    name: Обновление поверх прошлой версии
    needs: [engine, app]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Прошлая версия
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/*)
              base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || true) ;;
            *) base=${PR_BASE:-$BEFORE} ;;
          esac
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD^)
          fi
          echo "Прошлая версия: $(git log -1 --format='%h %s' "$base")"
          dir="$RUNNER_TEMP/upgrade-base"
          git worktree add --detach "$dir" "$base"
          # Первый прогон: у прошлой версии ещё нет шага 1 — он берётся
          # отсюда, если собирается с её кодом.
          for f in integration_test/upgrade_seed_test.dart \
            integration_test/support/upgrade_snapshot.dart; do
            if [ ! -f "$dir/app/$f" ]; then
              echo "::notice::У прошлой версии нет $f — взят из этой"
              cp "$f" "$dir/app/$f"
            fi
          done
          echo "BASE_APP=$dir/app" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Зависимости обеих версий
        run: |
          flutter pub get
          cd "$BASE_APP" && flutter pub get
      - name: KVM для эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Обновление поверх прошлой версии
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none
          working-directory: app
          script: tool/integration/upgrade_on_emulator.sh "$BASE_APP"

  # iOS приостановлен до релиза v1.0 (решение 2026-09-27, docs/roadmap.md,
  # Фаза 8): сборка не блокирует PR и не тратит время macOS. Запуск вручную
  # (Actions → CI → Run workflow) — проверить, что iOS-часть ещё собирается.
  # Без подписи, в TestFlight не уходит.
  build-ios:
    name: Сборка iOS (вручную)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ios }}
    needs: [engine, app]
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Debug-сборка без подписи (dev)
        run: flutter build ios --debug --no-codesign --dart-define-from-file=env/dev.json

# Сайт на GitHub Pages из site/: политика конфиденциальности для Google Play
# и приложения (адрес — app/lib/core/config/app_links.dart). Включить один
# раз: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Сайт

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Публикация на GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # Владелец и адрес для связи в политике — до отправки в Google Play
      # (docs/beta/play-console.md).
      - name: Заглушки TODO
        run: |
          if grep -rn 'TODO' site; then
            echo "::warning::В site/ остались заглушки TODO — вписать до отправки политики в Google Play"
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5

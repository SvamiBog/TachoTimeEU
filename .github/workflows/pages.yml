# Сайт на GitHub Pages из site/: политика конфиденциальности для Google Play
# и приложения (адрес — app/lib/core/config/app_links.dart) и файл с
# правилами запретов движения bans/v1.json, по которому приложения
# обновляют правила без новой версии (docs/domain/driving-bans.md). Включить
# один раз: Settings → Pages → Build and deployment → Source: GitHub Actions.
#
# Публикуется после зелёного CI на main: правила из файла через сутки у всех
# водителей — только проверенные тестами. Вручную — текущий main.
name: Сайт

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Публикация на GitHub Pages
    # Только push в main этого репозитория: в PR из форка ветка тоже может
    # называться main, а здесь доступен ключ подписи.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    # Как в ci.yml: версия Ubuntu закреплена
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Тот коммит, который проверил CI, а не новый main
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Владелец и адрес для связи в политике — до отправки в Google Play
      # (docs/beta/play-console.md).
      - name: Заглушки TODO
        run: |
          if grep -rn 'TODO' site; then
            echo "::warning::В site/ остались заглушки TODO — вписать до отправки политики в Google Play"
          fi
      - uses: subosito/flutter-action@v2
        with:
          # Как FLUTTER_VERSION в ci.yml
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      # Правила движка, подписанные ключом BANS_SIGNING_KEY: подпись
      # проверяет приложение. Без ключа сайт не публикуется — иначе файл
      # пропал бы с сайта (приложения остались бы на прошлых правилах).
      - name: Файл с правилами запретов
        working-directory: app
        env:
          BANS_SIGNING_KEY: ${{ secrets.BANS_SIGNING_KEY }}
        run: |
          if [ -z "$BANS_SIGNING_KEY" ]; then
            echo "::error::Секрет BANS_SIGNING_KEY не задан: файл с правилами запретов не подписать (docs/domain/driving-bans.md, «Обновление по сети»)"
            exit 1
          fi
          flutter pub get
          dart run tool/bans_publish.dart ../site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5

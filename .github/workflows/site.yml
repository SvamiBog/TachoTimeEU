# Сайт tachogo.eu на Railway (docs/site/README.md): лендинг на английском,
# польском и немецком (собирает app/tool/site_build.dart из docs/site/),
# политика конфиденциальности для Google Play и приложения (адрес —
# app/lib/core/config/app_links.dart) и файл с правилами запретов движения
# bans/v1.json, по которому приложения обновляют правила без новой версии
# (docs/domain/driving-bans.md). Папку site/ отдаёт Caddy
# (deploy/site/Dockerfile, Caddyfile) в сервисе «site» проекта Railway, регион
# ЕС. Нужны секреты BANS_SIGNING_KEY и RAILWAY_TOKEN (токен проекта Railway).
#
# Публикуется после зелёного CI на main: правила из файла через сутки у всех
# водителей — только проверенные тестами. Вручную — текущий main.
name: Сайт

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    name: Публикация на Railway
    # Только push в main этого репозитория: в PR из форка ветка тоже может
    # называться main, а здесь доступен ключ подписи.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    # Как в ci.yml: версия Ubuntu закреплена
    runs-on: ubuntu-24.04
    environment:
      name: railway
      url: https://tachogo.eu/
    steps:
      - uses: actions/checkout@v5
        with:
          # Тот коммит, который проверил CI, а не новый main
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Владелец и адрес для связи в политике — до отправки в Google Play
      # (docs/beta/play-console.md).
      - name: Заглушки TODO
        run: |
          if grep -rn 'TODO' site; then
            echo "::warning::В site/ остались заглушки TODO — вписать до отправки политики в Google Play"
          fi
      - uses: subosito/flutter-action@v2
        with:
          # Как FLUTTER_VERSION в ci.yml
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      # Правила движка, подписанные ключом BANS_SIGNING_KEY: подпись
      # проверяет приложение. Без ключа сайт не публикуется — иначе файл
      # пропал бы с сайта (приложения остались бы на прошлых правилах).
      - name: Файл с правилами запретов
        working-directory: app
        env:
          BANS_SIGNING_KEY: ${{ secrets.BANS_SIGNING_KEY }}
        run: |
          if [ -z "$BANS_SIGNING_KEY" ]; then
            echo "::error::Секрет BANS_SIGNING_KEY не задан: файл с правилами запретов не подписать (docs/domain/driving-bans.md, «Обновление по сети»)"
            exit 1
          fi
          flutter pub get
          dart run tool/bans_publish.dart ../site
      # Страницы лендинга, карта сайта и robots.txt (docs/site/README.md)
      - name: Лендинг
        working-directory: app
        run: dart run tool/site_build.dart ../site
      # Папка для railway up — вне репозитория: в .gitignore собранные
      # страницы и bans/, Railway их пропустил бы.
      - name: Пакет для Railway
        run: |
          out="$RUNNER_TEMP/site"
          mkdir -p "$out"
          cp deploy/site/Dockerfile deploy/site/Caddyfile "$out/"
          cp -r site "$out/public"
          test -f "$out/public/bans/v1.json"
          test -f "$out/public/index.html"
      - name: Выкладка на Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Секрет RAILWAY_TOKEN не задан: токен проекта Railway (docs/site/README.md, «Railway»)"
            exit 1
          fi
          npm install --global @railway/cli@5.63.1
          railway up "$RUNNER_TEMP/site" --service site --ci --no-gitignore
      # Домен мог быть ещё не подключён — тогда только предупреждение
      - name: Сайт отвечает
        run: |
          sleep 20
          for path in "" privacy/ bans/v1.json; do
            if ! curl -fsS -o /dev/null "https://tachogo.eu/$path"; then
              echo "::warning::https://tachogo.eu/$path не отвечает — проверить домен в Railway и DNS (docs/site/README.md)"
            fi
          done

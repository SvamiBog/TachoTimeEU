# Артефакты запусков хранятся две недели, debug APK — три дня (решения
# владельца 19.10 и 20.10.2026): место под них на аккаунте ограничено, а
# debug APK — ~100 МБ на каждый запуск CI, и 19.10.2026 квота кончилась.
# Новые артефакты сами живут сколько надо (`retention-days` в ci.yml и
# store.yml); этот workflow удаляет то, что старше, — и то, что сохранено
# раньше на 90 или 14 дней. Каждый день, вручную и при изменении этого файла.
name: Очистка артефактов

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/artifacts.yml

permissions:
  actions: write

concurrency:
  group: artifacts-cleanup

jobs:
  cleanup:
    name: Артефакты старше 14 дней, debug APK — 3
    runs-on: ubuntu-24.04
    steps:
      - name: Удалить старые артефакты
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cutoff=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          # Debug APK — android-<sha>; AAB выпуска (android-release-<sha>)
          # живёт 14 дней, как остальные
          apk_cutoff=$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.expired | not)
              | select(.created_at < \"$cutoff\"
                or ((.name | test(\"^android-[0-9a-f]{40}$\"))
                  and .created_at < \"$apk_cutoff\"))
              | \"\(.id) \(.size_in_bytes) \(.name)\"" > old.txt
          count=0
          bytes=0
          while read -r id size name; do
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id"
            echo "удалён $name"
            count=$((count + 1))
            bytes=$((bytes + size))
          done < old.txt
          echo "Удалено артефактов старше $cutoff и debug APK старше $apk_cutoff: $count, $((bytes / 1048576)) МБ" \
            | tee -a "$GITHUB_STEP_SUMMARY"

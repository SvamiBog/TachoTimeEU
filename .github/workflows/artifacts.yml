# Артефакты запусков хранятся две недели (решение владельца 19.10.2026):
# место под них на аккаунте ограничено, а debug APK — ~100 МБ на каждый
# запуск CI, и 19.10.2026 квота кончилась. Новые артефакты сами живут
# 14 дней (`retention-days` в ci.yml и store.yml); этот workflow удаляет
# всё, что старше, — и то, что сохранено ещё на 90 дней. Каждый день, вручную
# и при изменении этого файла.
name: Очистка артефактов

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/artifacts.yml

permissions:
  actions: write

concurrency:
  group: artifacts-cleanup

jobs:
  cleanup:
    name: Артефакты старше 14 дней
    runs-on: ubuntu-24.04
    steps:
      - name: Удалить артефакты старше 14 дней
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cutoff=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.expired | not)
              | select(.created_at < \"$cutoff\")
              | \"\(.id) \(.size_in_bytes) \(.name)\"" > old.txt
          count=0
          bytes=0
          while read -r id size name; do
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id"
            echo "удалён $name"
            count=$((count + 1))
            bytes=$((bytes + size))
          done < old.txt
          echo "Удалено артефактов старше $cutoff: $count, $((bytes / 1048576)) МБ" \
            | tee -a "$GITHUB_STEP_SUMMARY"

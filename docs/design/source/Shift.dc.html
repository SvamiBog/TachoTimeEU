<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Смена</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111315;font-family:'Onest',sans-serif;color:#EDEBE6}
a{color:#F3B33D}a:hover{color:#FFD27A}
button,textarea{font-family:inherit}
textarea::placeholder{color:#8C9197}
</style>
</helmet>
<div style="width: 412px; height: 1240px; box-sizing: border-box; background: #111315; color: #EDEBE6; font-family: 'Onest', sans-serif; display: flex; flex-direction: column;">

<header style="height: 64px; box-sizing: border-box; padding: 8px 4px; display: flex; align-items: center; gap: 4px;">
<a href="Journal.dc.html" aria-label="Назад" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #EDEBE6;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
<h1 style="margin: 0; font-size: 18px; font-weight: 700;">Смена</h1>
<span style="font-size: 12px; color: #A3A8AE;">Вторник, 22 сентября</span>
</div>
<a href="Journal.dc.html" aria-label="Сохранить" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #F3B33D;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></a>
</header>

<h2 style="margin: 12px 20px 10px; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A8AE;">Смена</h2>
<div style="margin: 0 16px; background: #1A1D20; border-radius: 24px; overflow: hidden; flex-shrink: 0;">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));">
<div style="padding: 16px; display: flex; flex-direction: column; gap: 10px;">
<span style="font-size: 13px; color: #A3A8AE;">Начало</span>
<a href="CountryPicker.dc.html" style="align-self: flex-start; height: 40px; padding: 0 12px 0 14px; border-radius: 20px; border: 1px solid #3A3F45; display: flex; align-items: center; gap: 6px; text-decoration: none; color: #EDEBE6; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700;">PL <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A3A8AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a>
<div style="display: flex; flex-direction: column; gap: 6px;">
<a href="ShiftDateTime.dc.html" aria-label="Начало: дата Вт, 22.09" style="height: 44px; padding: 0 12px; box-sizing: border-box; border-radius: 12px; background: #111315; display: flex; align-items: center; gap: 8px; text-decoration: none; color: #EDEBE6;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A3A8AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg><span style="font-size: 15px; font-weight: 600;">Вт, 22.09</span></a>
<a href="ShiftDateTime.dc.html" aria-label="Начало: время 06:30" style="height: 44px; padding: 0 12px; box-sizing: border-box; border-radius: 12px; background: #111315; display: flex; align-items: center; gap: 8px; text-decoration: none; color: #EDEBE6;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A3A8AE" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg><span style="font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 700;">06:30</span></a>
</div>
</div>
<div style="padding: 16px; border-left: 1px solid #262A2F; display: flex; flex-direction: column; gap: 10px;">
<span style="font-size: 13px; color: #A3A8AE;">Конец</span>
<a href="CountryPicker.dc.html" style="align-self: flex-start; height: 40px; padding: 0 12px 0 14px; border-radius: 20px; border: 1px solid #3A3F45; display: flex; align-items: center; gap: 6px; text-decoration: none; color: #EDEBE6; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700;">PL <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A3A8AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a>
<div style="display: flex; flex-direction: column; gap: 6px;">
<a href="ShiftDateTime.dc.html" aria-label="Конец: дата Вт, 22.09" style="height: 44px; padding: 0 12px; box-sizing: border-box; border-radius: 12px; background: #111315; display: flex; align-items: center; gap: 8px; text-decoration: none; color: #EDEBE6;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A3A8AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg><span style="font-size: 15px; font-weight: 600;">Вт, 22.09</span></a>
<a href="ShiftDateTime.dc.html" aria-label="Конец: время 19:10" style="height: 44px; padding: 0 12px; box-sizing: border-box; border-radius: 12px; background: #111315; display: flex; align-items: center; gap: 8px; text-decoration: none; color: #EDEBE6;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A3A8AE" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg><span style="font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 700;">19:10</span></a>
</div>
</div>
</div>
<div style="min-height: 52px; padding: 0 16px; border-top: 1px solid #262A2F; display: flex; align-items: center;">
<span style="flex-grow: 1; font-size: 15px; font-weight: 600;">Длительность</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 700; color: #A3A8AE;">12:40</span>
</div>
</div>

<h2 style="margin: 24px 20px 10px; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A8AE;">Вождение</h2>
<div style="margin: 0 16px; background: #1A1D20; border-radius: 24px; overflow: hidden; flex-shrink: 0;">
<a href="TimeEdit.dc.html" style="min-height: 56px; padding: 0 16px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #EDEBE6;">
<span style="flex-grow: 1; font-size: 15px; font-weight: 600;">За день</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 700;">8:55</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A8AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</a>
<a href="TimeEdit.dc.html" style="min-height: 56px; padding: 0 16px; border-top: 1px solid #262A2F; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #EDEBE6;">
<span style="flex-grow: 1; font-size: 15px; font-weight: 600;">Непрерывное на конец смены</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 700;">2:05</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A8AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</a>
</div>

<h2 style="margin: 24px 20px 10px; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A8AE;">Отдых после смены</h2>
<div style="margin: 0 16px; background: #1A1D20; border-radius: 24px; overflow: hidden; flex-shrink: 0;">
<div style="padding: 16px;">
<div role="group" aria-label="Тип отдыха" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 16px; background: #111315;">
<button type="button" aria-pressed="{{rNone.pressed}}" onClick="{{rNone.pick}}" style="height: 40px; border: none; border-radius: 12px; background: {{rNone.bg}}; color: {{rNone.fg}}; font-size: 14px; font-weight: 600; cursor: pointer;">Не начат</button>
<button type="button" aria-pressed="{{rDaily.pressed}}" onClick="{{rDaily.pick}}" style="height: 40px; border: none; border-radius: 12px; background: {{rDaily.bg}}; color: {{rDaily.fg}}; font-size: 14px; font-weight: 600; cursor: pointer;">Суточный</button>
<button type="button" aria-pressed="{{rWeekly.pressed}}" onClick="{{rWeekly.pick}}" style="height: 40px; border: none; border-radius: 12px; background: {{rWeekly.bg}}; color: {{rWeekly.fg}}; font-size: 14px; font-weight: 600; cursor: pointer;">Недельный</button>
</div>
</div>
<div style="padding: 14px 16px; border-top: 1px solid #262A2F; display: flex; align-items: center; gap: 16px;">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 15px; font-weight: 600;">Раздельный отдых 3 + 9</span>
<span style="font-size: 13px; color: #A3A8AE;">Сначала 3 ч, затем 9 ч</span>
</div>
<button type="button" role="switch" aria-checked="{{split.checked}}" aria-label="Раздельный отдых" onClick="{{split.toggle}}" style="width: 52px; height: 32px; flex-shrink: 0; padding: 4px; box-sizing: border-box; border: none; border-radius: 16px; background: {{split.bg}}; display: flex; justify-content: {{split.jc}}; cursor: pointer;"><span style="width: 24px; height: 24px; border-radius: 12px; background: {{split.knob}};"></span></button>
</div>
<div style="min-height: 56px; padding: 0 16px; border-top: 1px solid #262A2F; display: flex; align-items: center; gap: 12px;">
<span style="flex-grow: 1; font-size: 15px; font-weight: 600;">Длительность</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 700;">11:39</span>
<span style="font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 8px; background: #16261F; color: #9FE3CE;">полный</span>
</div>
</div>

<h2 style="margin: 24px 20px 10px; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A8AE;">Заметки</h2>
<label style="margin: 0 16px; display: block;">
<textarea aria-label="Заметки" placeholder="Например: паром, ожидание загрузки" style="width: 100%; height: 96px; box-sizing: border-box; padding: 14px 16px; border: none; border-radius: 20px; background: #1A1D20; color: #EDEBE6; font-size: 15px; line-height: 1.4; resize: none; outline: none;"></textarea>
</label>

<button type="button" style="margin: auto 16px 24px; height: 56px; border-radius: 18px; border: 1px solid #5A2A27; background: transparent; color: #FF8F87; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 600; cursor: pointer;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"></path></svg>
Удалить смену
</button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const rest = s.rest || 'daily';
    const split = !!s.split;
    const seg = (id) => ({ pressed: rest === id ? 'true' : 'false', bg: rest === id ? '#2F343A' : 'transparent', fg: rest === id ? '#EDEBE6' : '#A3A8AE', pick: () => this.setState({ rest: id }) });
    return {
      rNone: seg('none'), rDaily: seg('daily'), rWeekly: seg('weekly'),
      split: { checked: split ? 'true' : 'false', bg: split ? '#F3B33D' : '#3A3F45', knob: split ? '#111315' : '#A3A8AE', jc: split ? 'flex-end' : 'flex-start', toggle: () => this.setState({ split: !split }) }
    };
  }
}
</script>
</body>
</html>

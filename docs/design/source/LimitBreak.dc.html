<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Перерыв</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111315;font-family:'Onest',sans-serif;color:#EDEBE6}
a{color:#F3B33D}a:hover{color:#FFD27A}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 412px; height: 915px; box-sizing: border-box; background: #111315; color: #EDEBE6; font-family: 'Onest', sans-serif; display: flex; flex-direction: column;">

<header style="height: 64px; box-sizing: border-box; padding: 8px 4px; display: flex; align-items: center; gap: 4px;">
<a href="Main.dc.html" aria-label="Назад" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #EDEBE6;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin: 0; flex-grow: 1; font-size: 18px; font-weight: 700;">Перерыв</h1>
<a href="Main.dc.html" aria-label="Сохранить" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #F3B33D;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></a>
</header>

<section style="margin: 8px 16px 0; padding: 20px; background: #1A1D20; border-radius: 28px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; justify-content: space-between; align-items: baseline;">
<span style="font-size: 15px; font-weight: 600;">Перерыв после 4:30 вождения</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700;">0:15 / 0:45</span>
</div>
<div style="display: grid; grid-template-columns: 1fr 2fr; gap: 6px;">
<div style="height: 36px; border-radius: 10px; background: #4FBF9F; color: #0E2A22; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;">15 мин ✓</div>
<div style="height: 36px; border-radius: 10px; border: 1.5px dashed #4FBF9F; color: #9FE3CE; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;">30 мин — осталось</div>
</div>
<span style="font-size: 13px; color: #A3A8AE;">Первая часть взята в 08:48–09:03</span>
</section>

<h2 style="margin: 24px 20px 10px; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A8AE;">Корректировка</h2>
<div style="margin: 0 16px; background: #1A1D20; border-radius: 24px; overflow: hidden; flex-shrink: 0;">
<div style="padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px;">
<span style="font-size: 15px; font-weight: 600;">Длительность</span>
<div role="group" aria-label="Длительность перерыва" style="position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 52px; height: 48px; border-radius: 14px; background: #262A2F;"></div>
<div style="position: relative; display: flex; flex-direction: column; align-items: center;">
<span style="height: 52px; display: flex; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 20px; color: #5A6068;">—</span>
<span style="height: 48px; display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700;">0 <span style="font-family: 'Onest', sans-serif; font-size: 15px; font-weight: 500; color: #A3A8AE;">ч</span></span>
<span style="height: 52px; display: flex; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 20px; color: #5A6068;">1</span>
</div>
<div style="position: relative; display: flex; flex-direction: column; align-items: center;">
<span style="height: 52px; display: flex; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 20px; color: #5A6068;">14</span>
<span style="height: 48px; display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700;">15 <span style="font-family: 'Onest', sans-serif; font-size: 15px; font-weight: 500; color: #A3A8AE;">мин</span></span>
<span style="height: 52px; display: flex; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 20px; color: #5A6068;">16</span>
</div>
</div>
</div>
<div style="padding: 16px; border-top: 1px solid #262A2F; display: flex; align-items: center; gap: 16px;">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 15px; font-weight: 600;">Раздельный перерыв 15 + 30</span>
<span style="font-size: 13px; line-height: 1.4; color: #A3A8AE;">Первая часть не меньше 15 мин, вторая — не меньше 30 мин</span>
</div>
<button type="button" role="switch" aria-checked="{{split.checked}}" aria-label="Раздельный перерыв" onClick="{{split.toggle}}" style="width: 52px; height: 32px; flex-shrink: 0; padding: 4px; box-sizing: border-box; border: none; border-radius: 16px; background: {{split.bg}}; display: flex; justify-content: {{split.jc}}; cursor: pointer;"><span style="width: 24px; height: 24px; border-radius: 12px; background: {{split.knob}};"></span></button>
</div>
</div>

<a href="Main.dc.html" style="margin: auto 16px 24px; height: 56px; border-radius: 18px; background: #F3B33D; color: #111315; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; font-weight: 700;">Сохранить</a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const on = s.split !== false;
    return {
      split: { checked: on ? 'true' : 'false', bg: on ? '#F3B33D' : '#3A3F45', knob: on ? '#111315' : '#A3A8AE', jc: on ? 'flex-end' : 'flex-start', toggle: () => this.setState({ split: !on }) }
    };
  }
}
</script>
</body>
</html>

include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - test/drift/**/generated/**

linter:
  rules:
    # Описания модулей и классов — на английском (DOC-07), комментарии к
    # полям и функциям — на русском; публичный API целиком не документируем.
    public_member_api_docs: false

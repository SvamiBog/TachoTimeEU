include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - "**/*.g.dart"
    - test/drift/**/generated/**

linter:
  rules:
    # Комментарии в проекте на русском, публичный API документируем по мере стабилизации.
    public_member_api_docs: false

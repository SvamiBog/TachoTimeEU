# Локализация интерфейса (ARB/ICU). Исходный язык — русский, файлы
# генерируются в lib/l10n/ и лежат в git: dart run build_runner их не
# трогает, CI сверяет с `flutter gen-l10n`.
arb-dir: lib/l10n
template-arb-file: app_ru.arb
# Телефон на языке без перевода — русский: его читают водители из
# стран СНГ, для которых перевода пока нет (docs/PRD.md, Tier 1).
preferred-supported-locales: [ru]
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
format: true

name: tachogo
description: "TachoGo: EU 561/2006 driving and rest time tracker"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  clock: ^1.1.3
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_foreground_task: ^11.0.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  geolocator: ^14.0.3
  intl: ^0.20.2
  path_provider: ^2.1.6
  posthog_flutter: ^5.48.0
  sentry_flutter: ^9.30.1
  sqlite3: ^3.5.2
  tacho_engine:
    path: ../packages/tacho_engine

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
  yaml: ^3.1.4

flutter:
  uses-material-design: true
  generate: true
  # Onest и JetBrains Mono (OFL, лицензии рядом): статические начертания,
  # нарезанные из вариативных шрифтов Google Fonts, — assets/fonts/README.md.
  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Regular.ttf
          weight: 400
        - asset: assets/fonts/Onest-Medium.ttf
          weight: 500
        - asset: assets/fonts/Onest-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Onest-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
